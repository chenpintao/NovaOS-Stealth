/* ========== Toast ========== */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background-color:var(--nr-bg-elevated);color:var(--nr-text-primary);border:1px solid var(--nr-border-color);box-shadow:var(--nr-shadow-float);padding:var(--nr-space-sm) var(--nr-space-lg);border-radius:var(--nr-radius-md);font-size:var(--nr-font-size-sm);z-index:var(--nr-z-toast);opacity:0;transition:opacity var(--nr-transition-normal),transform var(--nr-transition-normal);pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== Bookshelf Page ========== */
.shelf-search-bar{display:flex;align-items:center;gap:var(--nr-space-sm);padding:var(--nr-space-md) var(--nr-space-lg) var(--nr-space-sm)}
.shelf-sort-wrapper{flex-shrink:0}
.shelf-sort{padding:var(--nr-space-xs) var(--nr-space-sm);font-size:var(--nr-font-size-xs);color:var(--nr-text-secondary);background-color:var(--nr-bg-tertiary);border-color:transparent}
.book-more-btn{flex-shrink:0;width:36px;height:36px;border-radius:var(--nr-radius-md);border:none;background:none;color:var(--nr-text-tertiary);display:flex;align-items:center;justify-content:center;transition:background var(--nr-transition-fast),color var(--nr-transition-fast)}
.book-more-btn:hover{color:var(--nr-accent-text);background-color:var(--nr-accent-light)}
.book-more-btn svg{width:18px;height:18px}
/* Book action popover - matches selection menu style */
.book-action-popover{position:fixed;z-index:var(--nr-z-toast);background-color:var(--nr-bg-elevated);border-radius:var(--nr-radius-md);box-shadow:var(--nr-shadow-float);padding:var(--nr-space-xs);display:flex;gap:var(--nr-space-xs);white-space:nowrap;opacity:0;visibility:hidden;will-change:transform,opacity;transform:translateX(-50%) translateY(-12px);transition:opacity var(--nr-transition-fast),visibility 0s linear var(--nr-transition-fast),transform var(--nr-transition-fast)}
.book-action-popover.anchor-center{transform:translateX(-50%) translateY(-12px)}
.book-action-popover.anchor-right{transform:translateX(calc(-100% + 18px)) translateY(-12px)}
.book-action-popover.active{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);transition:opacity var(--nr-transition-fast),visibility 0s linear 0s,transform var(--nr-transition-fast)}
.book-action-popover.active.anchor-right{transform:translateX(calc(-100% + 18px)) translateY(0)}
.book-action-popover button{display:flex;align-items:center;gap:4px;padding:var(--nr-space-xs) var(--nr-space-sm);border:none;background:none;color:var(--nr-accent-text);font-size:var(--nr-font-size-xs);border-radius:var(--nr-radius-sm);transition:background var(--nr-transition-fast);font-family:inherit}
.book-action-popover button:hover{background-color:var(--nr-accent-light)}
.book-action-popover button.danger{color:var(--nr-state-error)}
.book-action-popover button svg{width:14px;height:14px;flex-shrink:0}
.book-progress{display:flex;align-items:center;gap:var(--nr-space-xs);margin-top:var(--nr-space-xs)}
.book-progress .nr-progress{flex:1;height:2px}
.book-progress .pct{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);white-space:nowrap}
.book-chapter-info{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);margin-top:var(--nr-space-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book-name{font-size:var(--nr-font-size-sm);color:var(--nr-text-primary);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ========== Shelf Page ========== */
#page-shelf{background-color:var(--nr-bg-secondary)}
#page-shelf #book-list{background-color:transparent}
.book-item-wrapper{background-color:var(--nr-reader-bg);border-radius:var(--nr-radius-md);margin:var(--nr-space-sm) var(--nr-space-lg);overflow:hidden;box-shadow:var(--nr-shadow-sm)}
.book-item-wrapper .nr-list-item{border-bottom:none}

/* ========== Reader Page ========== */
#page-reader{position:relative}
#reader-topbar{position:absolute;top:0;left:0;right:0;z-index:var(--nr-z-toolbar);transform:translateY(0);visibility:visible;will-change:transform;transition:transform var(--nr-transition-normal),visibility 0s linear 0s}
#reader-toolbar{position:absolute;bottom:0;left:0;right:0;z-index:var(--nr-z-toolbar);transform:translateY(0);visibility:visible;pointer-events:auto;touch-action:manipulation;will-change:transform;transition:transform var(--nr-transition-normal),visibility 0s linear 0s}
#page-reader .nr-progress{position:absolute;bottom:var(--reader-toolbar-height,67px);left:0;right:0;z-index:var(--nr-z-toolbar);transform:translateY(0);visibility:visible;will-change:transform;transition:transform var(--nr-transition-normal),visibility 0s linear 0s}
#page-reader .nr-progress-text{position:absolute;bottom:calc(var(--reader-toolbar-height,67px) + 3px);left:0;right:0;z-index:var(--nr-z-toolbar);transform:translateY(0);visibility:visible;will-change:transform;transition:transform var(--nr-transition-normal),visibility 0s linear 0s}
#reader-topbar.reader-hidden{transform:translateY(-100%);visibility:hidden;pointer-events:none;transition:transform var(--nr-transition-normal),visibility 0s linear var(--nr-transition-normal)}
#reader-toolbar.reader-toolbar-hidden{transform:translateY(100%);visibility:hidden;pointer-events:none;transition:transform var(--nr-transition-normal),visibility 0s linear var(--nr-transition-normal)}
.reader-fade-hidden{opacity:0;pointer-events:none}
.reader-content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background-color:var(--nr-reader-bg);padding:var(--nr-space-2xl) var(--nr-space-xl);margin-top:48px;margin-bottom:var(--reader-toolbar-height,67px);transition:margin 300ms ease}
.reader-content.fullscreen{margin-top:0;margin-bottom:0}
.reader-content article{max-width:var(--reader-max-width,min(600px,100%));margin:0 auto}
.reader-content .ch-title{text-align:center;font-size:var(--nr-font-size-lg);font-weight:500;color:var(--nr-text-primary);margin-bottom:var(--nr-space-2xl);word-break:keep-all}
.reader-text{font-size:var(--reader-font-size,18px);font-family:var(--nr-font-display);color:var(--nr-reader-text);letter-spacing:0.04em;-webkit-user-select:text;user-select:text}
.reader-text p{margin-bottom:var(--nr-space-2xl)}
.reader-text mark{background-color:var(--nr-highlight-bg);color:var(--nr-highlight-text);padding:0 2px;border-radius:2px}
.reader-text .search-highlight{background-color:var(--nr-highlight-bg);color:var(--nr-highlight-text);padding:0 2px;border-radius:2px}
.ch-nav{display:flex;align-items:center;justify-content:center;gap:var(--nr-space-2xl);padding-top:var(--nr-space-2xl);padding-bottom:var(--nr-space-lg);border-top:1px solid var(--nr-border-color);margin-top:var(--nr-space-2xl)}
.ch-nav .ch-nav-info{font-size:var(--nr-font-size-sm);color:var(--nr-text-tertiary)}

/* Reader line spacing */
.reader-lh-1{line-height:1.4!important}
.reader-lh-2{line-height:1.8!important}
.reader-lh-3{line-height:2.2!important}
/* Reader paragraph spacing */
.reader-ps-1 p{margin-bottom:0.4em!important}
.reader-ps-2 p{margin-bottom:0.8em!important}
.reader-ps-3 p{margin-bottom:1.2em!important}
/* Reader font family */
.reader-font-songti{font-family:var(--nr-font-display)!important}
.reader-font-heiti{font-family:var(--nr-font-body)!important}
.reader-font-system{font-family:-apple-system,system-ui,sans-serif!important}

/* ========== Settings Sheet ========== */
.settings-sheet{max-height:55vh}
.settings-sheet .nr-sheet-body{padding:var(--nr-space-md) var(--nr-space-lg) var(--nr-space-xl)}
.settings-group{margin-bottom:var(--nr-space-md)}
.settings-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--nr-space-xs)}
.settings-label label{font-size:var(--nr-font-size-sm);font-weight:500;color:var(--nr-text-secondary)}
.settings-label .value{font-size:var(--nr-font-size-sm);color:var(--nr-accent-text);font-weight:500}
.settings-group > label{display:block;font-size:var(--nr-font-size-sm);font-weight:500;color:var(--nr-text-secondary);margin-bottom:var(--nr-space-xs)}
.settings-divider{height:1px;background-color:var(--nr-divider);margin:var(--nr-space-sm) 0}
.settings-link{display:flex;align-items:center;justify-content:space-between;padding:var(--nr-space-sm) 0;border-bottom:1px solid var(--nr-divider);cursor:pointer}
.settings-link:last-child{border-bottom:none}
.settings-link span{font-size:var(--nr-font-size-sm);color:var(--nr-text-primary)}
.settings-link svg{width:16px;height:16px;color:var(--nr-text-tertiary);flex-shrink:0}

/* ========== Form Page (AI Settings, Chapter Rules) ========== */
.form-page{padding:var(--nr-space-lg) var(--nr-space-lg) var(--nr-space-4xl);max-width:480px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;min-height:0}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--nr-space-lg)}
.form-group label{font-size:var(--nr-font-size-sm);color:var(--nr-text-secondary)}
.form-hint{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);line-height:1.4}
.form-switch-row{display:flex;align-items:center;justify-content:space-between;gap:var(--nr-space-md)}
.form-switch-row .form-hint{flex:1}
.nr-input-unit{position:relative;display:flex;align-items:center}
.nr-input-unit .nr-input{padding-right:48px}
.nr-input-unit .unit{position:absolute;right:var(--nr-space-md);font-size:var(--nr-font-size-sm);color:var(--nr-text-tertiary);pointer-events:none}
.form-actions{display:flex;gap:var(--nr-space-md);margin-top:var(--nr-space-sm)}
.form-actions .nr-btn-primary,.form-actions .nr-btn-secondary{flex:1;white-space:nowrap}
.security-notice{display:flex;align-items:flex-start;gap:var(--nr-space-sm);padding-top:var(--nr-space-lg);padding-bottom:var(--nr-space-4xl)}
.security-notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;color:var(--nr-state-warning)}
.security-notice p{font-size:var(--nr-font-size-sm);color:var(--nr-text-tertiary);line-height:1.5}

/* ========== Chapter Rules Page ========== */
.rules-hint{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);padding:var(--nr-space-md);background-color:var(--nr-bg-tertiary);border-radius:var(--nr-radius-md);margin-bottom:var(--nr-space-lg);line-height:1.5}
.rule-item{display:flex;align-items:center;justify-content:space-between;padding:var(--nr-space-md) 0;border-bottom:1px solid var(--nr-divider)}
.rule-item span{font-size:var(--nr-font-size-sm);color:var(--nr-text-primary)}
.rule-item .rule-example{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);margin-top:2px}
.rule-item .rule-text{flex:1}
.rules-section-title{font-size:var(--nr-font-size-sm);font-weight:600;color:var(--nr-text-secondary);margin-bottom:var(--nr-space-md);margin-top:var(--nr-space-lg)}
.custom-rules textarea{width:100%;min-height:120px;padding:var(--nr-space-md);background-color:var(--nr-input-bg);border:1px solid var(--nr-input-border);border-radius:var(--nr-radius-md);font-size:var(--nr-font-size-sm);color:var(--nr-text-primary);outline:none;resize:vertical;font-family:var(--nr-font-body);line-height:1.6}
.custom-rules textarea:focus{border-color:var(--nr-input-focus-border)}

/* ========== Search Panel ========== */
.search-results{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:0}
.search-result-item{padding:var(--nr-space-md) var(--nr-space-lg);border-bottom:1px solid var(--nr-divider);cursor:pointer;transition:background var(--nr-transition-fast)}
.search-result-item:hover{background-color:var(--nr-accent-light)}
.search-result-item .sr-chapter{font-size:var(--nr-font-size-sm);color:var(--nr-text-primary);font-weight:500;margin-bottom:4px}
.search-result-item .sr-context{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.search-result-item .sr-context mark{background-color:var(--nr-highlight-bg);color:var(--nr-highlight-text)}
.search-status{padding:var(--nr-space-md);text-align:center;font-size:var(--nr-font-size-sm);color:var(--nr-text-tertiary)}

/* ========== Bookmarks Panel ========== */
.bookmark-item{display:flex;align-items:flex-start;padding:var(--nr-space-md) var(--nr-space-lg);border-bottom:1px solid var(--nr-divider);gap:var(--nr-space-md);cursor:pointer}
.bookmark-item:hover{background-color:var(--nr-accent-light)}
.bookmark-item .bm-icon{width:16px;height:16px;color:var(--nr-accent-text);flex-shrink:0;margin-top:2px}
.bookmark-item .bm-content{flex:1;min-width:0}
.bookmark-item .bm-chapter{font-size:var(--nr-font-size-xs);color:var(--nr-text-tertiary);margin-bottom:2px}
.bookmark-item .bm-snippet{font-size:var(--nr-font-size-sm);color:var(--nr-text-primary);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bookmark-item .bm-delete{width:24px;height:24px;border:none;background:none;color:var(--nr-text-tertiary);flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:var(--nr-radius-sm)}
.bookmark-item .bm-delete:hover{color:var(--nr-state-error);background-color:var(--nr-state-error-light)}
.bookmark-item .bm-delete svg{width:14px;height:14px}

/* ========== Confirm Dialog ========== */
.confirm-dialog{position:fixed;inset:0;background-color:var(--nr-bg-overlay);z-index:var(--nr-z-toast);display:none;align-items:center;justify-content:center}
.confirm-dialog.active{display:flex}
.confirm-box{background-color:var(--nr-bg-secondary);border-radius:var(--nr-radius-lg);padding:var(--nr-space-xl);max-width:300px;width:80%;text-align:center}
.confirm-box h3{font-size:var(--nr-font-size-lg);font-weight:600;color:var(--nr-text-primary);margin-bottom:var(--nr-space-sm)}
.confirm-box p{font-size:var(--nr-font-size-sm);color:var(--nr-text-secondary);line-height:1.5;margin-bottom:var(--nr-space-lg)}
.confirm-box .confirm-actions{display:flex;gap:var(--nr-space-md)}
.confirm-box .confirm-actions button{flex:1;padding:var(--nr-space-sm) var(--nr-space-md);border-radius:var(--nr-radius-md);font-size:var(--nr-font-size-sm);font-weight:500;border:none;transition:opacity var(--nr-transition-fast)}
.confirm-box .btn-cancel{background-color:var(--nr-bg-tertiary);color:var(--nr-text-secondary)}
.confirm-box .btn-confirm{background-color:var(--nr-state-error);color:var(--nr-text-inverse)}
.confirm-box .btn-confirm:hover{opacity:0.85}

/* ========== Misc ========== */
.hidden{display:none!important}
.fade-in{animation:fadeIn 300ms ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.loading-dots::after{content:'';animation:dots 1.5s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}100%{content:''}}
</style>
</head>
<body>
<div id="app">

<!-- ========== Bookshelf Page ========== -->
<div id="page-shelf" class="page active">
  <header class="nr-topbar sticky">
    <h1 class="nr-text-left">我的书架</h1>
    <button class="nr-icon-btn nr-btn-icon-secondary" id="btn-import" title="导入小说" aria-label="导入小说"><span data-icon="plus"></span></button>
  </header>
  <div class="shelf-search-bar">
    <div class="nr-search-bar nr-flex-1">

      <input type="text" id="shelf-search" placeholder="搜索书名">
    </div>
    <div class="nr-select-wrapper shelf-sort-wrapper">

    </div>
  </div>
</div>

<!-- ========== Reader Page ========== -->
<div id="page-reader" class="page">
  <header class="nr-topbar" id="reader-topbar">
    <button class="nr-icon-btn" id="btn-reader-back" title="返回" aria-label="返回"><span data-icon="arrow-left"></span></button>

    <div class="spacer"></div>
  </header>

<!-- ========== Settings Sheet ========== -->
<div id="sheet-settings" class="overlay">
  <div class="nr-sheet-overlay" data-close="sheet-settings"></div>
  <div class="nr-sheet settings-sheet">
    <div class="nr-sheet-handle"></div>

        <div class="settings-label"><label>正文宽度</label><span class="value" id="reader-width-value">600px</span></div>

/* ========== State ========== */
const State = {
  db: null,
  currentBook: null,
  currentChapterIndex: 0,
  currentChapterText: '',
  selectedText: '',
  lastToolbarHeight: 0,
  settings: {
    fontSize: 4, fontFamily: 'songti', lineSpacing: 2, paraSpacing: 2,
    theme: 'day', fullscreen: false, readerWidth: 2,
  },
  chapterRules: { builtin: {}, custom: '' },
  books: [],
};

/* ========== Constants ========== */
const DB_NAME = 'NovelReader';
const DB_VERSION = 2;
const CHUNK_SIZE = 65536;

const BUILTIN_RULES = [
  { id:'prelude', name:'序 / 前言 / 楔子 / 引子 / 开篇', example:'序章、序言、楔子', pattern:'^[\\s]*((序章|序言|前言|楔子|引子|引言|开篇)[^\\n]*)$' },
  { id:'chapter_diji', name:'第 X 章 / 第 X 回', example:'第1章、第十章、第一百二十三章', pattern:'^[\\s]*(第[0-9一二三四五六七八九十百千万]+[章节回][^\\n]*)$' },
  { id:'section', name:'第 X 节', example:'第1节、第三节', pattern:'^[\\s]*(第[0-9一二三四五六七八九十百千万]+节[^\\n]*)$' },
  { id:'volume', name:'卷 X', example:'卷一、卷十二', pattern:'^[\\s]*(卷[0-9一二三四五六七八九十百千万]+[^\\n]*)$' },
  { id:'chapter_en', name:'Chapter / CHAPTER', example:'Chapter 1、CHAPTER 10', pattern:'^[\\s]*(Chapter\\s+\\d+[^\\n]*)$', flags:'im' },
  { id:'extra', name:'番外 / 外传 / 前传 / 后传 / 间章', example:'番外一、前传·起源、间章', pattern:'^[\\s]*((番外|外传|前传|后传|间章|幕间|特别篇|IF线)[^\\n]*)$', flags:'im' },
  { id:'ending', name:'尾声 / 后记 / 终章 / 大结局', example:'尾声、后记、大结局', pattern:'^[\\s]*((尾声|后记|终章|大结局|完结)[^\\n]*)$' },
  { id:'arabic_title', name:'阿拉伯数字标题', example:'1. 标题、001: 标题', pattern:'^[\\s]*(\\d{1,4}[.、：:]\\s*[^\\n]+)$' },
  { id:'digits', name:'纯数字章节', example:'1、001、002', pattern:'^[\\s]*(\\d{1,4})$' },
  { id:'markdown', name:'Markdown 标题', example:'## 第一章 开端', pattern:'^#{1,6}\\s+([^\\n]+)$' },
];
const FONT_SIZES = [12, 14, 16, 18, 20, 22, 24, 26];
const WIDTH_VALUES = ['480px', '600px', '720px', '840px', '960px', '全宽'];

/* ========== IndexedDB ========== */
function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('books')) db.createObjectStore('books', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('file_blobs')) db.createObjectStore('file_blobs', { keyPath: 'bookId' });
      if (!db.objectStoreNames.contains('progress')) db.createObjectStore('progress', { keyPath: 'bookId' });
      if (!db.objectStoreNames.contains('bookmarks')) db.createObjectStore('bookmarks', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { State.db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e.target.error);
  });
}
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const req = State.db.transaction(store).objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const req = State.db.transaction(store).objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    const req = State.db.transaction(store, 'readwrite').objectStore(store).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const req = State.db.transaction(store, 'readwrite').objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbClear(store) {
  return new Promise((resolve, reject) => {
    const req = State.db.transaction(store, 'readwrite').objectStore(store).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ========== Settings Storage ========== */
async function saveSetting(key, value) {
  try { await dbPut('settings', { key, value }); }
  catch (e) { console.error('saveSetting failed:', key, e); }
}
async function loadSetting(key, def) {
  try { const r = await dbGet('settings', key); return r ? r.value : def; }
  catch (e) { console.error('loadSetting failed:', key, e); return def; }
}
async function loadAllSettings() {
  State.settings.fontSize = await loadSetting('fontSize', 4);
  State.settings.fontFamily = await loadSetting('fontFamily', 'songti');
  State.settings.lineSpacing = await loadSetting('lineSpacing', 2);
  State.settings.paraSpacing = await loadSetting('paraSpacing', 2);
  State.settings.readerWidth = await loadSetting('readerWidth', 2);
  State.settings.theme = await loadSetting('theme', 'day');
  State.settings.fullscreen = await loadSetting('fullscreen', false);
  const ruleState = await loadSetting('chapterRules', null);
  if (ruleState) {
    State.chapterRules = ruleState;
  } else {
    BUILTIN_RULES.forEach(r => State.chapterRules.builtin[r.id] = true);
    State.chapterRules.custom = '';
  }
}

/* ========== Encoding Detection ========== */
function detectEncoding(buffer) {
  const head = new Uint8Array(buffer.slice(0, 4096));
  if (head[0] === 0xEF && head[1] === 0xBB && head[2] === 0xBF) return 'utf-8';
  if (head[0] === 0xFF && head[1] === 0xFE) return 'utf-16le';
  if (head[0] === 0xFE && head[1] === 0xFF) return 'utf-16be';
  try {
    new TextDecoder('utf-8', { fatal: true }).decode(head);
    return 'utf-8';
  } catch {
    const relaxed = new TextDecoder('utf-8', { fatal: false }).decode(head);
    const rep = (relaxed.match(/\uFFFD/g) || []).length;
    const nonAscii = (relaxed.match(/[^\x00-\x7F]/g) || []).length;
    if (nonAscii > 0 && rep / nonAscii < 0.05) return 'utf-8';
    if (nonAscii === 0 && rep === 0) return 'utf-8';
    return 'gbk';
  }
}

/* ========== Chapter Scanning ========== */
function buildChapterRegex() {
  const patterns = [];
  for (const rule of BUILTIN_RULES) {
    if (State.chapterRules.builtin[rule.id] !== false) {
      const flags = (rule.flags || 'm') + ((rule.flags || '').includes('g') ? '' : 'g');
      patterns.push(new RegExp(rule.pattern, flags));
    }
  }
  const customLines = (State.chapterRules.custom || '').split('\n').filter(l => l.trim());
  for (const line of customLines) {
    try {
      const re = new RegExp(line, 'm');
      const flags = re.flags.includes('g') ? re.flags : re.flags + 'g';
      patterns.push(new RegExp(line, flags));
    } catch(e) {}
  }
  return patterns;
}
function cleanTitle(raw) {
  return raw.trim().replace(/^#{1,6}\s+/, '').replace(/^[\s]+/, '')
    .replace(/[。，,.、:：\s]+$/, '').trim();
}
async function scanChapters(blob, encoding) {
  const decoder = new TextDecoder(encoding, { fatal: false });
  const patterns = buildChapterRegex();
  const chapters = [];
  let totalChars = 0;
  let byteOffset = 0;
  let lastChStart = 0;
  let lastChTitle = '';
  let prevTail = '';
  const overlapLen = 500;

  while (byteOffset < blob.size) {
    const endByte = Math.min(byteOffset + CHUNK_SIZE, blob.size);
    const buf = await blob.slice(byteOffset, endByte).arrayBuffer();
    const isLast = endByte >= blob.size;
    const decoded = decoder.decode(buf, { stream: !isLast });
    const text = prevTail + decoded;
    const prevTailLen = prevTail.length;

    for (const re of patterns) {
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        if (m.index < prevTailLen) { re.lastIndex = m.index + 1; continue; }
        const charPos = totalChars + m.index - prevTailLen;
        if (!lastChTitle) {
          // First chapter found
          lastChStart = charPos;
          lastChTitle = cleanTitle(m[0]);
        } else if (charPos > lastChStart) {
          chapters.push({ title: lastChTitle, startChar: lastChStart, endChar: charPos });
          lastChStart = charPos;
          lastChTitle = cleanTitle(m[0]);
        }
        if (re.lastIndex === m.index) re.lastIndex++;
      }
    }

    totalChars += decoded.length;
    prevTail = decoded.slice(-overlapLen);
    byteOffset = endByte;
  }

  if (lastChTitle) {
    chapters.push({ title: lastChTitle, startChar: lastChStart, endChar: totalChars });
  }

  if (chapters.length === 0) {
    const chunkChars = 5000;
    const num = Math.ceil(totalChars / chunkChars);
    for (let i = 0; i < num; i++) {
      chapters.push({ title: `第 ${i + 1} 节`, startChar: i * chunkChars, endChar: Math.min((i + 1) * chunkChars, totalChars) });
    }
  }
  return { chapters, totalChars };
}

/* ========== File Import ========== */
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function importFile(file) {
  try {
    const buf = await file.arrayBuffer();
    const encoding = detectEncoding(buf);
    const blob = new Blob([buf]);
    const ext = file.name.split('.').pop().toLowerCase();
    const format = ext === 'md' ? 'md' : 'txt';
    const bookId = uuid();
    const { chapters, totalChars } = await scanChapters(blob, encoding);

    const book = {
      id: bookId, name: file.name.replace(/\.[^.]+$/, ''),
      fileName: file.name, fileSize: file.size,
      encoding, format, chapters, totalChars, addedAt: Date.now(),
    };
    await dbPut('books', book);
    await dbPut('file_blobs', { bookId, blob });
    await dbPut('progress', { bookId, chapterIndex: 0, percentage: 0, updatedAt: Date.now() });
    return book;
  } catch (e) {
    console.error('importFile failed:', e);
    showToast('导入失败：' + (e.message || '无法解析文件'));
    throw e;
  }
}

async function reimportBook(bookId, newEncoding) {
  try {
    const book = await dbGet('books', bookId);
    const blobRec = await dbGet('file_blobs', bookId);
    if (!book || !blobRec) return;
    const encoding = newEncoding || book.encoding;
    const { chapters, totalChars } = await scanChapters(blobRec.blob, encoding);
    const oldProgress = await dbGet('progress', bookId);
    book.encoding = encoding;
    book.chapters = chapters;
    book.totalChars = totalChars;
    await dbPut('books', book);
    // Migrate progress
    let newChIdx = 0;
    if (oldProgress && oldProgress.chapterIndex < chapters.length) {
      newChIdx = oldProgress.chapterIndex;
    }
    const pct = chapters.length > 0 ? Math.round((newChIdx / chapters.length) * 100) : 0;
    await dbPut('progress', { bookId, chapterIndex: newChIdx, percentage: pct, updatedAt: Date.now() });
  } catch (e) {
    console.error('reimportBook failed:', e);
    showToast('重新识别章节失败');
  }
}

/* ========== Chapter Reading ========== */
async function getBlob(bookId) {
  const rec = await dbGet('file_blobs', bookId);
  return rec ? rec.blob : null;
}

const chapterTextCache = new Map();
const MAX_CACHED_CHAPTERS = 50;

function getCachedChapterText(bookId, chapterIndex) {
  const key = `${bookId}:${chapterIndex}`;
  if (chapterTextCache.has(key)) {
    const value = chapterTextCache.get(key);
    // Refresh LRU order
    chapterTextCache.delete(key);
    chapterTextCache.set(key, value);
    return value;
  }
  return undefined;
}

function setCachedChapterText(bookId, chapterIndex, text) {
  const key = `${bookId}:${chapterIndex}`;
  if (chapterTextCache.size >= MAX_CACHED_CHAPTERS) {
    const firstKey = chapterTextCache.keys().next().value;
    chapterTextCache.delete(firstKey);
  }
  chapterTextCache.set(key, text);
}

function clearChapterTextCache(bookId) {
  for (const key of chapterTextCache.keys()) {
    if (key.startsWith(bookId + ':')) chapterTextCache.delete(key);
  }
}

async function readChapterText(book, chapterIndex) {
  const chapter = book.chapters[chapterIndex];
  if (!chapter) return '';
  const cached = getCachedChapterText(book.id, chapterIndex);
  if (cached !== undefined) return cached;
  const blob = await getBlob(book.id);
  if (!blob) return '';
  const decoder = new TextDecoder(book.encoding, { fatal: false });
  let charCount = 0;
  let byteOffset = 0;
  let result = '';
  let prevTail = '';

  while (byteOffset < blob.size && charCount < chapter.endChar) {
    const endByte = Math.min(byteOffset + CHUNK_SIZE, blob.size);
    const buf = await blob.slice(byteOffset, endByte).arrayBuffer();
    const isLast = endByte >= blob.size;
    const decoded = prevTail + decoder.decode(buf, { stream: !isLast });
    const prevTailLen = prevTail.length;
    const adjStart = chapter.startChar - charCount + prevTailLen;
    const adjEnd = chapter.endChar - charCount + prevTailLen;

    if (adjEnd > 0 && adjStart < decoded.length) {
      const s = Math.max(prevTailLen, adjStart);
      const e = Math.min(decoded.length, adjEnd);
      if (e > s) result += decoded.slice(s, e);
    }
    charCount += decoded.length - prevTailLen;
    prevTail = decoded.slice(-500);
    byteOffset = endByte;
  }
  setCachedChapterText(book.id, chapterIndex, result);
  return result;
}

async function preloadAdjacentChapters(book, currentIndex) {
  if (!book || !book.chapters) return;
  const nextIndex = currentIndex + 1;
  if (nextIndex >= 0 && nextIndex < book.chapters.length) {
    if (getCachedChapterText(book.id, nextIndex) === undefined) {
      try { await readChapterText(book, nextIndex); } catch (e) {}
    }
  }
}

/* ========== Full Text Search ========== */
function findChapterIndex(chapters, charPos) {
  for (let i = chapters.length - 1; i >= 0; i--) {
    if (charPos >= chapters[i].startChar) return i;
  }
  return 0;
}

const MAX_SEARCH_RESULTS = 500;
const SEARCH_PAGE_SIZE = 20;

async function searchBook(book, keyword) {
  const blob = await getBlob(book.id);
  if (!blob) return [];
  const decoder = new TextDecoder(book.encoding, { fatal: false });
  const overlapSize = keyword.length + 200;
  const results = [];
  let charCount = 0;
  let byteOffset = 0;
  let prevTail = '';

  while (byteOffset < blob.size && results.length < MAX_SEARCH_RESULTS) {
    const endByte = Math.min(byteOffset + CHUNK_SIZE, blob.size);
    const buf = await blob.slice(byteOffset, endByte).arrayBuffer();
    const isLast = endByte >= blob.size;
    const decoded = prevTail + decoder.decode(buf, { stream: !isLast });
    const prevTailLen = prevTail.length;
    let pos = 0;
    let idx;
    while ((idx = decoded.indexOf(keyword, pos)) !== -1 && results.length < MAX_SEARCH_RESULTS) {
      const globalPos = charCount + idx - prevTailLen;
      const chIdx = findChapterIndex(book.chapters, globalPos);
      const ch = book.chapters[chIdx];
      const ctxStart = Math.max(0, idx - 40);
      const ctxEnd = Math.min(decoded.length, idx + keyword.length + 40);
      const context = decoded.slice(ctxStart, ctxEnd);
      results.push({ chapterIndex: chIdx, chapterTitle: ch ? ch.title : '未知', context, keyword, charPos: globalPos });
      pos = idx + keyword.length;
    }
    charCount += decoded.length - prevTailLen;
    prevTail = decoded.slice(-overlapSize);
    byteOffset = endByte;
  }
  return results;
}

/* ========== Utility ========== */
function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration || 2000);
}
function showConfirm(title, msg, onConfirm) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-message').textContent = msg;
  const dlg = document.getElementById('confirm-dialog');
  dlg.classList.add('active');
  const ok = document.getElementById('confirm-ok');
  const cancel = document.getElementById('confirm-cancel');
  const handler = () => { dlg.classList.remove('active'); ok.onclick = null; cancel.onclick = null; onConfirm(); };
  const canceler = () => { dlg.classList.remove('active'); ok.onclick = null; cancel.onclick = null; };
  ok.onclick = handler;
  cancel.onclick = canceler;
}
function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function exportTextFile(content, filename) {
  const blob = new Blob(['\uFEFF' + content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
function sanitizeFilename(name) {
  return name.replace(/[\\/:*?"<>|]/g, '_');
}

/* ========== Navigation ========== */
let pageStack = ['page-shelf'];

function navigateToPage(pageId) {
  const el = document.getElementById(pageId);
  if (!el) return;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  el.classList.add('active');

  const idx = pageStack.indexOf(pageId);
  if (idx === -1) pageStack.push(pageId);
  else pageStack = pageStack.slice(0, idx + 1);

  if (pageId === 'page-shelf') {
    loadBooks().then(renderBookshelf);
  }
}

function showPage(pageId) {
  navigateToPage(pageId);
}

function goBack() {
  // Close any open overlay first
  const activeOverlay = document.querySelector('.overlay.active');
  if (activeOverlay) {
    hideOverlay(activeOverlay.id);
    return true;
  }
  // Close any open popover
  const popover = document.getElementById('book-action-popover');
  if (popover && popover.classList.contains('active')) {
    hideBookActionPopover();
    return true;
  }
  if (pageStack.length > 1) {
    pageStack.pop();
    const prev = pageStack[pageStack.length - 1];
    navigateToPage(prev);
    return true;
  }
  return false;
}
function showOverlay(id) {
  const overlayEl = document.getElementById(id);
  overlayEl.classList.add('active');
  const sheet = overlayEl.querySelector('.nr-sheet');
  const drawer = overlayEl.querySelector('.nr-drawer');
  const sheetOverlay = overlayEl.querySelector('.nr-sheet-overlay');
  const drawerOverlay = overlayEl.querySelector('.nr-drawer-overlay');
  if (sheetOverlay) sheetOverlay.classList.add('active');
  if (drawerOverlay) drawerOverlay.classList.add('active');
  // Force a reflow so the initial transform state is painted before animating
  if (sheet) sheet.offsetHeight;
  if (drawer) drawer.offsetHeight;
  if (sheet) sheet.classList.add('active');
  if (drawer) drawer.classList.add('active');
}
function hideOverlay(id) {
  const overlayEl = document.getElementById(id);
  const sheet = overlayEl.querySelector('.nr-sheet');
  const drawer = overlayEl.querySelector('.nr-drawer');
  const sheetOverlay = overlayEl.querySelector('.nr-sheet-overlay');
  const drawerOverlay = overlayEl.querySelector('.nr-drawer-overlay');
  if (sheet) sheet.classList.remove('active');
  if (drawer) drawer.classList.remove('active');
  if (sheetOverlay) sheetOverlay.classList.remove('active');
  if (drawerOverlay) drawerOverlay.classList.remove('active');
  setTimeout(() => overlayEl.classList.remove('active'), 300);
}

/* ========== Bookshelf Rendering ========== */
async function loadBooks() {
  const books = await dbGetAll('books');
  const progressMap = {};
  const allProgress = await dbGetAll('progress');
  allProgress.forEach(p => { progressMap[p.bookId] = p; });
  books.forEach(b => { b._progress = progressMap[b.id] || null; });
  State.books = books;
  return books;
}
function sortBooks(books, mode) {
  if (mode === 'name') return [...books].sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  return [...books].sort((a, b) => {
    const ta = a._progress?.updatedAt || a.addedAt;
    const tb = b._progress?.updatedAt || b.addedAt;
    return tb - ta;
  });
}
function renderBookshelf() {
  const list = document.getElementById('book-list');
  const empty = document.getElementById('shelf-empty');
  const keyword = document.getElementById('shelf-search').value.toLowerCase();
  const sortMode = document.getElementById('shelf-sort').value;
  let books = sortBooks(State.books, sortMode);
  if (keyword) books = books.filter(b => b.name.toLowerCase().includes(keyword));
  if (books.length === 0) {
    list.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }
  list.classList.remove('hidden');
  empty.classList.add('hidden');
  list.innerHTML = books.map(book => {
    const p = book._progress;
    const pct = p ? p.percentage : 0;
    const chInfo = p && p.chapterIndex < book.chapters.length
      ? `第 ${p.chapterIndex + 1} 章 · ${book.chapters[p.chapterIndex]?.title || ''}`
      : '未开始阅读';
    return `<div class="book-item-wrapper" data-book-id="${book.id}">
      <div class="nr-list-item" data-action="open" data-book-id="${book.id}">
        <div class="nr-flex-1">
          <span class="book-name">${escapeHtml(book.name)}</span>
          <div class="book-progress">
            <div class="nr-progress"><div class="nr-progress-fill" style="width:${pct}%"></div></div>
            <span class="pct">${pct}%</span>
          </div>
          <p class="book-chapter-info">${escapeHtml(chInfo)}</p>
        </div>
        <button class="book-more-btn" data-action="more" data-book-id="${book.id}" title="更多操作">${svgIcon('more-horizontal', 18)}</button>
      </div>
    </div>`;
  }).join('');
}

/* ========== Book Action Popover ========== */
let activeBookActionId = null;
function showBookActionPopover(bookId, anchorEl) {
  activeBookActionId = bookId;
  const popover = document.getElementById('book-action-popover');
  popover.classList.remove('anchor-center', 'anchor-right');
  const rect = anchorEl.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  popover.style.left = centerX + 'px';
  popover.style.top = (rect.bottom + 8) + 'px';
  // Boundary detection: if centered popover would overflow right edge, anchor to right
  const estimatedWidth = 220;
  if (centerX + estimatedWidth / 2 > window.innerWidth - 12) {
    popover.classList.add('anchor-right');
  } else {
    popover.classList.add('anchor-center');
  }
  popover.classList.add('active');
}
function hideBookActionPopover() {
  document.getElementById('book-action-popover').classList.remove('active');
  activeBookActionId = null;
}
function initBookActionPopover() {
  const popover = document.getElementById('book-action-popover');
  popover.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const bookId = activeBookActionId;
      hideBookActionPopover();
      if (!bookId) return;
      if (action === 'encode') switchEncoding(bookId);
      else if (action === 'split') resplitBook(bookId);
      else if (action === 'delete') deleteBook(bookId);
    });
  });
}

/* ========== Reader Rendering ========== */
async function openBook(bookId) {
  const book = await dbGet('books', bookId);
  if (!book) { showToast('书籍不存在'); return; }
  State.currentBook = book;
  const progress = await dbGet('progress', bookId);
  State.currentChapterIndex = progress ? progress.chapterIndex : 0;
  showPage('page-reader');
  await renderReader();
}
async function renderReader() {
  const book = State.currentBook;
  if (!book) return;
  const readerText = document.getElementById('reader-text');
  try {
    document.getElementById('reader-title').textContent = book.name;
    const ch = book.chapters[State.currentChapterIndex];
    if (!ch) return;
    document.getElementById('reader-ch-title').textContent = ch.title;
    document.getElementById('ch-nav-info').textContent = `第 ${State.currentChapterIndex + 1} 章 / 共 ${book.chapters.length} 章`;
    // Show loading
    readerText.innerHTML = '<p class="nr-text-center nr-text-tertiary">加载中...</p>';
    const text = await readChapterText(book, State.currentChapterIndex);
    State.currentChapterText = text;
    // Strip chapter title from the beginning of text to avoid duplication
    let displayText = text;
    const titleTrimmed = ch.title.trim();
    if (displayText.startsWith(titleTrimmed)) {
      displayText = displayText.slice(titleTrimmed.length).replace(/^[\n\r\s]+/, '');
    }
    // Render paragraphs
    const paragraphs = displayText.split('\n').filter(l => l.trim());
    readerText.innerHTML = paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('');
    // Apply reader classes
    applyReaderClasses();
    // Scroll to top
    document.getElementById('reader-content').scrollTop = 0;
  } catch (err) {
    readerText.innerHTML = `<p class="nr-text-center" style="color:var(--nr-state-error)">章节加载失败：${escapeHtml(err.message || '未知错误')}</p>`;
    showToast('章节加载失败：' + err.message);
  } finally {
    // Update progress
    updateProgress();
    // Render chapter list in drawer
    renderChapterList();
    // Measure toolbar height for layout
    updateReaderToolbarHeight();
    // Preload next chapter in background for smoother navigation
    preloadAdjacentChapters(book, State.currentChapterIndex);
  }
}
function applyReaderClasses() {
  const rt = document.getElementById('reader-text');
  const s = State.settings;
  rt.className = 'reader-text';
  rt.classList.add(`reader-font-${s.fontFamily}`);
  rt.classList.add(`reader-lh-${s.lineSpacing}`);
  rt.classList.add(`reader-ps-${s.paraSpacing}`);
  document.documentElement.style.setProperty('--reader-font-size', FONT_SIZES[s.fontSize - 1] + 'px');
  const widthValue = s.readerWidth === 6 ? '100%' : `min(${WIDTH_VALUES[s.readerWidth - 1]}, 100%)`;
  document.documentElement.style.setProperty('--reader-max-width', widthValue);
}
const lastSavedProgress = {};

function updateProgress() {
  const book = State.currentBook;
  if (!book) return;
  const idx = State.currentChapterIndex;
  const pct = Math.round(((idx + 1) / book.chapters.length) * 100);
  document.getElementById('reader-progress-fill').style.width = pct + '%';
  document.getElementById('reader-progress-text').textContent = pct + '%';
  // Save progress only when chapter or percentage changes to reduce IndexedDB writes
  const last = lastSavedProgress[book.id];
  if (!last || last.chapterIndex !== idx || last.percentage !== pct) {
    dbPut('progress', { bookId: book.id, chapterIndex: idx, percentage: pct, updatedAt: Date.now() });
    lastSavedProgress[book.id] = { chapterIndex: idx, percentage: pct };
  }
}
function clearSearchHighlights() {
  document.querySelectorAll('.search-highlight').forEach(el => {
    el.replaceWith(document.createTextNode(el.textContent));
  });
}

async function goToChapter(idx) {
  if (!State.currentBook) return;
  if (idx < 0 || idx >= State.currentBook.chapters.length) return;
  clearSearchHighlights();
  State.currentChapterIndex = idx;
  await renderReader();
}
function renderChapterList() {
  const book = State.currentBook;
  if (!book) return;
  const list = document.getElementById('chapter-list');
  document.getElementById('drawer-ch-count').textContent = `共 ${book.chapters.length} 章`;
  list.innerHTML = book.chapters.map((ch, i) => {
    const wordCount = ch.endChar - ch.startChar;
    const active = i === State.currentChapterIndex ? 'active' : '';
    return `<div class="nr-chapter-item ${active}" data-ch-idx="${i}">
      <div class="nr-flex-1">
        <p class="ch-title">${escapeHtml(ch.title)}</p>
        <p class="ch-words">${wordCount > 1000 ? (wordCount/1000).toFixed(1) + 'k' : wordCount} 字</p>
      </div>
    </div>`;
  }).join('');

  const activeItem = list.querySelector('.nr-chapter-item.active');
  if (activeItem) activeItem.scrollIntoView({ block: 'center' });
}

/* ========== Search ========== */
let searchTimer = null;
let currentSearchResults = [];
let currentSearchPage = 0;

async function doSearch() {
  const keyword = document.getElementById('search-input').value.trim();
  const status = document.getElementById('search-status');
  const results = document.getElementById('search-results');
  currentSearchResults = [];
  currentSearchPage = 0;
  if (!keyword || !State.currentBook) {
    status.classList.add('hidden');
    results.innerHTML = '';
    return;
  }
  status.classList.remove('hidden');
  status.textContent = '正在搜索…';
  results.innerHTML = '';
  currentSearchResults = await searchBook(State.currentBook, keyword);
  if (currentSearchResults.length === 0) {
    status.textContent = '未找到相关内容';
    return;
  }
  status.textContent = `找到 ${currentSearchResults.length} 处匹配`;
  renderSearchPage();
}

function renderSearchPage() {
  const results = document.getElementById('search-results');
  const end = (currentSearchPage + 1) * SEARCH_PAGE_SIZE;
  const pageResults = currentSearchResults.slice(0, end);
  results.innerHTML = pageResults.map((r, i) => {
    const ctx = r.context.replace(new RegExp(escapeRegex(r.keyword), 'g'), `<mark>${escapeHtml(r.keyword)}</mark>`);
    return `<div class="search-result-item" data-sr-idx="${i}">
      <p class="sr-chapter">${escapeHtml(r.chapterTitle)}</p>
      <p class="sr-context">${ctx}</p>
    </div>`;
  }).join('');

  if (end < currentSearchResults.length) {
    results.insertAdjacentHTML('beforeend', `<button class="nr-btn-secondary nr-btn-block" id="search-load-more">加载更多（还剩 ${currentSearchResults.length - end} 条）</button>`);
    document.getElementById('search-load-more').addEventListener('click', () => {
      currentSearchPage++;
      renderSearchPage();
    });
  }

  results.querySelectorAll('.search-result-item').forEach(item => {
    item.addEventListener('click', async () => {
      const idx = parseInt(item.dataset.srIdx);
      const r = currentSearchResults[idx];
      await goToChapter(r.chapterIndex);
      hideOverlay('sheet-search');
      highlightSearchResult(r.keyword);
    });
  });
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightSearchResult(keyword) {
  const readerText = document.getElementById('reader-text');
  if (!keyword || !readerText) return;
  const re = new RegExp(escapeRegex(keyword), 'gi');
  const walker = document.createTreeWalker(readerText, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  let node;
  while ((node = walker.nextNode())) textNodes.push(node);
  for (const n of textNodes) {
    const text = n.textContent;
    re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIndex = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIndex) frag.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      const mark = document.createElement('span');
      mark.className = 'search-highlight';
      mark.textContent = m[0];
      frag.appendChild(mark);
      lastIndex = m.index + m[0].length;
      if (re.lastIndex === m.index) re.lastIndex++;
    }
    if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.slice(lastIndex)));
    n.parentNode.replaceChild(frag, n);
  }
  const first = readerText.querySelector('.search-highlight');
  if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* ========== Book Actions ========== */
async function switchEncoding(bookId) {
  const book = await dbGet('books', bookId);
  if (!book) return;
  const newEnc = book.encoding === 'utf-8' ? 'gbk' : 'utf-8';
  showConfirm('切换编码', `将从 ${book.encoding.toUpperCase()} 切换到 ${newEnc.toUpperCase()}，会重新切分章节。确定？`, async () => {
    showToast('正在重新切分...');
    await reimportBook(bookId, newEnc);
    showToast('编码已切换');
    await loadBooks();
    renderBookshelf();
    if (State.currentBook?.id === bookId) {
      State.currentBook = await dbGet('books', bookId);
      await renderReader();
    }
  });
}
async function resplitBook(bookId) {
  showConfirm('重新切分', '将按当前章节识别规则重新分析章节结构。确定？', async () => {
    showToast('正在重新切分...');
    await reimportBook(bookId);
    showToast('已重新切分');
    await loadBooks();
    renderBookshelf();
    if (State.currentBook?.id === bookId) {
      State.currentBook = await dbGet('books', bookId);
      await renderReader();
    }
  });
}
async function deleteBook(bookId) {
  const book = await dbGet('books', bookId);
  if (!book) return;
  showConfirm('删除书籍', `确定删除《${book.name}》？关联的进度和书签也会被清除。`, async () => {
    await dbDelete('books', bookId);
    await dbDelete('file_blobs', bookId);
    await dbDelete('progress', bookId);
    clearChapterTextCache(bookId);
    delete lastSavedProgress[bookId];
    const bms = await dbGetAll('bookmarks');
    for (const bm of bms) if (bm.bookId === bookId) await dbDelete('bookmarks', bm.id);
    await loadBooks();
    renderBookshelf();
    showToast('已删除');
  });
}

function fallbackCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '0';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

/* ========== Selection Menu ========== */
let selectionTimer = null;
function handleSelection(e) {
  clearTimeout(selectionTimer);
  selectionTimer = setTimeout(() => {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    const menu = document.getElementById('selection-menu');
    if (text.length > 0 && text.length < 2000 && isSelectionInReader(sel)) {
      State.selectedText = text;
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      positionSelectionMenu(menu, rect);
      menu.classList.remove('hidden');
    } else {
      menu.classList.add('hidden');
    }
  }, 300);
}
function positionSelectionMenu(menu, rect) {
  // Selection menu is always anchored at the bottom center (above the reader toolbar)
  // to avoid overlapping native selection handles/context menus on all devices.
  menu.style.left = '50%';
}
function isSelectionInReader(sel) {
  const reader = document.getElementById('reader-text');
  if (!reader || sel.rangeCount === 0) return false;
  const node = sel.getRangeAt(0).commonAncestorContainer;
  return reader.contains(node);
}

/* ========== Immersive Mode ========== */
let hideTimer = null;
function updateReaderToolbarHeight() {
  const toolbar = document.getElementById('reader-toolbar');
  if (!toolbar) return;
  const h = toolbar.offsetHeight;
  if (h === State.lastToolbarHeight) return;
  State.lastToolbarHeight = h;
  document.documentElement.style.setProperty('--reader-toolbar-height', h + 'px');
}
function setReaderControlsVisible(visible) {
  const topbar = document.getElementById('reader-topbar');
  const toolbar = document.getElementById('reader-toolbar');
  const progress = document.querySelector('#page-reader .nr-progress');
  const progressText = document.querySelector('#page-reader .nr-progress-text');
  const content = document.getElementById('reader-content');
  updateReaderToolbarHeight();
  if (visible) {
    topbar.classList.remove('reader-hidden');
    toolbar.classList.remove('reader-toolbar-hidden');
    content.classList.remove('fullscreen');
    if (progress) progress.classList.remove('reader-fade-hidden');
    if (progressText) progressText.classList.remove('reader-fade-hidden');
  } else {
    topbar.classList.add('reader-hidden');
    toolbar.classList.add('reader-toolbar-hidden');
    content.classList.add('fullscreen');
    if (progress) progress.classList.add('reader-fade-hidden');
    if (progressText) progressText.classList.add('reader-fade-hidden');
  }
}
function toggleReaderControls() {
  const topbar = document.getElementById('reader-topbar');
  const isVisible = !topbar.classList.contains('reader-hidden');
  setReaderControlsVisible(!isVisible);
}
function scheduleHideControls() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    const topbar = document.getElementById('reader-topbar');
    if (!topbar.classList.contains('reader-hidden')) {
      setReaderControlsVisible(false);
    }
  }, 3000);
}

/* ========== Tzy OS 文件管理器桥 ==========
 * 在 Tzy OS 内运行时（同源 iframe），导入走系统文件管理器：OS.pickFile()
 * 打开「文件」应用的选择模式，返回 {source,path,name}，再按来源读取字节流，
 * 包装成 File 交给 importFile。独立打开（没有 OS 宿主）时退回原生选择框。
 * Loshop & Cpt */
function osHost() {
  try {
    const w = window.parent;
    if (w && w !== window && w.OS && typeof w.OS.pickFile === 'function') return w.OS;
  } catch (e) { /* 跨源则视为无宿主 */ }
  return null;
}

async function readPicked(os, sel) {
  if (sel.source === 'vfs') return os.vfs.get(sel.path);
  if (sel.source === 'fs') return os.api.fs('get', { path: sel.path });
  if (sel.source === 'ftp') return os.api.ftp(Object.assign({}, os.store.get('nova2.ftp', {}), { op: 'get', path: sel.path }));
  return os.api.smb(Object.assign({}, os.store.get('nova2.smb', {}), { op: 'get', path: sel.path }));
}

async function pickFromFileManager(os) {
  // 默认落在「离线空间」（平板本机、离线可用，小说多存于此）；可切到电脑/FTP/SMB
  const sel = await os.pickFile({ mode: 'open', source: 'vfs' });
  if (!sel) return null;                        // 用户取消
  const r = await readPicked(os, sel);
  if (!r || r.ok === false) {
    throw new Error((r && (r.offline ? '服务不可达（离线）' : r.error)) || '读取失败');
  }
  const blob = r.text
    ? new Blob([r.content], { type: 'text/plain;charset=utf-8' })
    : os.b64ToBlob(r.data, r.mime || os.mimeOf(sel.name));
  return new File([blob], sel.name, { type: blob.type });
}

async function importFiles(files) {
  for (const file of files) {
    const existing = State.books.find(b => b.fileName === file.name && b.fileSize === file.size);
    if (existing) { showToast(`《${file.name}》已存在`); continue; }
    showToast(`正在导入 ${file.name}...`);
    try {
      await importFile(file);
      showToast(`已导入 ${file.name}`);
    } catch(err) { showToast(`导入失败: ${err.message}`); }
  }
  await loadBooks();
  renderBookshelf();
}

/* ========== Event Bindings ========== */
function initShelfEvents() {
  // Import：Tzy OS 内走系统文件管理器，否则退回原生选择框
  document.getElementById('btn-import').addEventListener('click', async () => {
    const os = osHost();
    if (!os) { document.getElementById('file-input').click(); return; }
    try {
      const file = await pickFromFileManager(os);
      if (file) await importFiles([file]);
    } catch (err) { showToast(`导入失败: ${err.message || err}`); }
  });
  document.getElementById('file-input').addEventListener('change', async (e) => {
    await importFiles(e.target.files);
    e.target.value = '';
  });
  // Shelf search & sort
  document.getElementById('shelf-search').addEventListener('input', debounce(() => renderBookshelf(), 200));
  document.getElementById('shelf-sort').addEventListener('change', () => renderBookshelf());
  // Delegate book list clicks (open / more)
  document.getElementById('book-list').addEventListener('click', (e) => {
    const moreEl = e.target.closest('[data-action="more"]');
    if (moreEl) {
      e.stopPropagation();
      showBookActionPopover(moreEl.dataset.bookId, moreEl);
      return;
    }
    const openEl = e.target.closest('[data-action="open"]');
    if (openEl) openBook(openEl.dataset.bookId);
  });
}

function initReaderEvents() {
  // Reader back
  document.getElementById('btn-reader-back').addEventListener('click', async () => {
    await loadBooks();
    renderBookshelf();
    showPage('page-shelf');
  });
  // Chapter navigation
  document.getElementById('btn-prev-ch').addEventListener('click', () => goToChapter(State.currentChapterIndex - 1));
  document.getElementById('btn-next-ch').addEventListener('click', () => goToChapter(State.currentChapterIndex + 1));
  // Toolbar buttons
  document.getElementById('btn-drawer').addEventListener('click', () => showOverlay('drawer-chapters'));
  document.getElementById('chapter-list').addEventListener('click', async (e) => {
    const item = e.target.closest('.nr-chapter-item');
    if (!item) return;
    const idx = parseInt(item.dataset.chIdx);
    await goToChapter(idx);
    hideOverlay('drawer-chapters');
  });
  document.getElementById('btn-settings').addEventListener('click', () => showOverlay('sheet-settings'));
  document.getElementById('btn-bookmark').addEventListener('click', () => { renderBookmarks(); showOverlay('sheet-bookmarks'); });
  document.getElementById('bookmark-list').addEventListener('click', async (e) => {
    const delBtn = e.target.closest('.bm-delete');
    if (delBtn) {
      e.stopPropagation();
      await dbDelete('bookmarks', delBtn.dataset.bmDel);
      renderBookmarks();
      showToast('书签已删除');
      return;
    }
    const item = e.target.closest('.bookmark-item');
    if (item) {
      await goToChapter(parseInt(item.dataset.bmCh));
      hideOverlay('sheet-bookmarks');
    }
  });
  document.getElementById('btn-search').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '';
    document.getElementById('search-status').classList.add('hidden');
    showOverlay('sheet-search');
  });
  // Search (debounced)
  document.getElementById('search-input').addEventListener('input', debounce(() => doSearch(), 500));
  // Reader tap center for immersive mode
  let touchStartY = 0, touchStartX = 0, touchMoved = false, lastTouchToggle = 0;
  const readerContent = document.getElementById('reader-content');
  function handleReaderTap(clientY) {
    const rect = readerContent.getBoundingClientRect();
    const y = clientY - rect.top;
    const h = rect.height;
    return y > h * 0.10 && y < h * 0.90;
  }
  readerContent.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    touchMoved = false;
  }, { passive: true });
  readerContent.addEventListener('touchmove', (e) => {
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    if (dy > 10 || dx > 10) touchMoved = true;
  }, { passive: true });
  readerContent.addEventListener('touchend', (e) => {
    if (touchMoved) return;
    if (handleReaderTap(e.changedTouches[0].clientY)) {
      lastTouchToggle = Date.now();
      toggleReaderControls();
    }
  }, { passive: true });
  // Click for desktop; ignore clicks immediately after a touch toggle to prevent double toggle on mobile
  readerContent.addEventListener('click', (e) => {
    if (Date.now() - lastTouchToggle < 350) return;
    if (handleReaderTap(e.clientY)) {
      if (!e.target.closest('button, a')) {
        toggleReaderControls();
      }
    }
    // Clear search highlights on tap
    clearSearchHighlights();
  });
  // Save progress on scroll (debounced)
  document.getElementById('reader-content').addEventListener('scroll', debounce(() => updateProgress(), 500));
}

function initSelectionEvents() {
  document.addEventListener('selectionchange', handleSelection);
  document.getElementById('sel-prev-ch').addEventListener('click', () => {
    document.getElementById('selection-menu').classList.add('hidden');
    goToChapter(State.currentChapterIndex - 1);
  });
  document.getElementById('sel-next-ch').addEventListener('click', () => {
    document.getElementById('selection-menu').classList.add('hidden');
    goToChapter(State.currentChapterIndex + 1);
  });
  document.getElementById('sel-bookmark').addEventListener('click', () => {
    document.getElementById('selection-menu').classList.add('hidden');
    addBookmark();
  });
  document.getElementById('sel-copy').addEventListener('click', async () => {
    const text = State.selectedText;
    let copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        copied = true;
      }
    } catch (e) {}
    if (!copied) copied = fallbackCopyText(text);
    showToast(copied ? '已复制' : '复制失败，请手动复制');
    document.getElementById('selection-menu').classList.add('hidden');
  });
}

function initSettingsEvents() {

    const btn = e.target.closest('.nr-segmented-item');

    document.querySelectorAll('#para-spacing-select .nr-segmented-item').forEach(b => b.classList.remove('active'));

  // Fullscreen
  document.getElementById('fullscreen-switch').addEventListener('click', toggleFullscreen);
  // Settings links

  // Chapter rules page
  document.getElementById('btn-rules-back').addEventListener('click', goBack);
  document.getElementById('btn-save-rules').addEventListener('click', saveChapterRulesPage);

function initBookmarkEvents() {
  // Bookmarks export/import/clear
  document.getElementById('btn-bm-export').addEventListener('click', exportBookmarks);
  document.getElementById('btn-bm-import').addEventListener('click', importBookmarks);
  document.getElementById('btn-bm-clear').addEventListener('click', async () => {
    if (!State.currentBook) return;
    showConfirm('清空本书书签', '确定要清空这本书的所有书签吗？清空后无法恢复。', async () => {
      const all = await dbGetAll('bookmarks');
      const toDelete = all.filter(b => b.bookId === State.currentBook.id);
      for (const b of toDelete) await dbDelete('bookmarks', b.id);
      renderBookmarks();
      showToast('书签已清空');
    });
  });
  document.getElementById('bookmark-input').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      const books = await dbGetAll('books');
      let imported = 0;
      for (const entry of data) {
        const book = books.find(b => b.name === entry.bookName && b.fileSize === entry.fileSize);
        if (!book) continue;
        for (const bm of entry.bookmarks) {
          if (bm.chapterIndex < book.chapters.length) {
            await dbPut('bookmarks', { id: uuid(), bookId: book.id, chapterIndex: bm.chapterIndex, snippet: bm.snippet, createdAt: bm.createdAt || Date.now() });
            imported++;
          }
        }
      }
      showToast(`已导入 ${imported} 个书签`);
      renderBookmarks();
    } catch(err) { showToast('导入失败: ' + err.message); }
    e.target.value = '';
  });
}

function initGlobalEvents() {
  // Close book action popover on outside tap
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.book-action-popover') && !e.target.closest('[data-action="more"]')) {
      hideBookActionPopover();
    }
  });
}

function bindEvents() {
  initShelfEvents();
  initReaderEvents();
  initSelectionEvents();
  initSettingsEvents();
  initBookmarkEvents();
  initGlobalEvents();
}

/* ========== Init ========== */
async function init() {
  window.__mjlog('info', '墨卷启动');
  renderIcons();
  await initDB();
  await loadAllSettings();
  applySettings();
  await loadBooks();
  renderBookshelf();

    const isFs = !!document.fullscreenElement;
    State.settings.fullscreen = isFs;
    saveSetting('fullscreen', isFs);
    updateFullscreenSwitchState(isFs);
  });
}
